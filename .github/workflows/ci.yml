# Continuous integration (docs/decisions/0023-continuous-integration-with-build-dependencies.md).
#
# One job per configure preset: its platform's build environment, then the same three
# preset commands as on a developer machine. No game data exists here, so the smoke
# tests report themselves as skipped.
#
# Images are named by their version and actions by the hash of their commit; moving to
# another is a commit of its own. The images' contents are listed in
# https://github.com/actions/runner-images.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.preset }}
    runs-on: ${{ matrix.image }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: ubuntu-24.04, preset: linux-debug }
          - { image: ubuntu-24.04, preset: linux-clang-debug }
          - { image: ubuntu-24.04, preset: linux-sanitize }
          - { image: ubuntu-24.04, preset: linux-release }
          - { image: ubuntu-24.04, preset: linux-sanitize-release }
          - { image: windows-2025, preset: windows-debug }
          - { image: windows-2025, preset: windows-release }
          - { image: windows-2025, preset: windows-clang-debug }
          - { image: windows-2025, preset: windows-clang-release }
          - { image: macos-15, preset: macos-debug }
          - { image: macos-15, preset: macos-release }
    env:
      PRESET: ${{ matrix.preset }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The library archives cmake/Dependencies.cmake pins. A changed pin is a new key.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/_deps
          key: deps-${{ runner.os }}-${{ hashFiles('cmake/Dependencies.cmake') }}

      # SDL is built against the system's display, audio and input headers and loads the
      # libraries at run time. The list is the one SDL's docs/README-linux.md gives for
      # Ubuntu 22.04 and later, less the build tools the image has and the package for
      # SDL's own tests.
      - name: Install SDL's build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes \
            libasound2-dev libpulse-dev libaudio-dev libfribidi-dev libjack-dev \
            libsndio-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
            libxfixes-dev libxi-dev libxss-dev libxtst-dev libxkbcommon-dev libdrm-dev \
            libgbm-dev libgl1-mesa-dev libgles2-mesa-dev libegl1-mesa-dev libdbus-1-dev \
            libibus-1.0-dev libudev-dev libthai-dev libusb-1.0-0-dev \
            libpipewire-0.3-dev libwayland-dev libdecor-0-dev liburing-dev

      - name: Configure, build and test
        if: runner.os != 'Windows'
        run: |
          cmake --preset "$PRESET"
          cmake --build --preset "$PRESET"
          ctest --preset "$PRESET"

      # The Windows presets use MSVC through Ninja and expect its environment, which the
      # Visual Studio installation's vcvars64.bat sets up; vswhere finds the installation.
      - name: Configure, build and test
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do (set "VSDIR=%%i")
          call "%VSDIR%\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
          cmake --preset %PRESET% || exit /b 1
          cmake --build --preset %PRESET% || exit /b 1
          ctest --preset %PRESET% || exit /b 1
